prompts:
  extended:
    somatic_arcana_card: |
      Somatic Canticles Major Arcana card {arcana_index}: {asset_title}.
      Biological event: {biological_event}. Sacred anatomy Tarot panel in a vertical card frame.
      Style: {illus_style}. References: {illus_references}.
      Clinical precision fused with mythic symbolism. Deep Neural Indigo dominates, Soma Gold as a surgical highlight, Severance Violet used sparingly for transformation cues.
      Mood keywords: {mood_keywords}. Render as a premium literary sacred-anatomy artifact, not fantasy slop.
      No text, no card labels, no generic new-age symbols, no clipart.

    somatic_anatomy_plate: |
      Somatic Canticles anatomy plate: {asset_title}.
      Subject focus: {anatomy_subject}. Sacred anatomy illustration with medical-illustration fidelity and luminous cosmic linework.
      Materials and motifs: {materials_list}. Environment: {photo_environment}.
      Clinical Mysticism aesthetic, atlas-page composition, gold technical annotations implied but not written.
      Premium editorial restraint, deep-indigo field, neuronal-white anatomy surfaces, soma-gold signal accents.
      No stock wellness imagery, no pulp-SF props, no decorative mandalas, no text.

    somatic_book_cover: |
      Premium literary book cover for Somatic Canticles: {book_title}.
      Narrative focus: {cover_focus}. Design a front-cover artwork system suitable for a hardcover edition with sacred anatomy, Tarot-biological geometry, and hard-SF editorial restraint.
      The trilogy visual language must stay consistent with Deep Neural Indigo structure, Soma Gold foil logic, and Severance Violet transformation cues.
      Feels adjacent to Tor Books literary SF design and Alex Grey sacred anatomy without imitating either directly.
      No title text, no author text, no fake blurbs, no pulp spaceship imagery.

    somatic_logo_mark: |
      Somatic Canticles logo mark study: {asset_title}.
      Variant direction: {logo_variant}. Material expression: {logo_material}.
      Build from the brand sigil logic: {sigil_description}. Premium identity object, centered composition, tactile lighting, deep-indigo and soma-gold palette discipline.
      Render as a refined symbol exploration suitable for a collector-grade literary identity system.
      No typography, no mockup scene, no packaging, no extra emblems beyond the core mark.
